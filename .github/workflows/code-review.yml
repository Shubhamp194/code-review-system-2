name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  code-review:
    name: Automated Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama server failed to start"
          cat /tmp/ollama.log || true
          exit 1

      - name: Pull Ollama model
        run: |
          ollama pull qwen2.5-coder:1.5b

      - name: Generate changed file list
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" \
              | grep -E '\.(java|ts|tsx|scss)$' > changed_files.txt || true
          else
            find . -type f \( -name "*.java" -o -name "*.ts" -o -name "*.tsx" -o -name "*.scss" \) \
              | sed 's#^\./##' > changed_files.txt
          fi

          echo "Changed/supported files:"
          cat changed_files.txt || true

      - name: Generate AI Code Explanation (Non-blocking)
        id: ai-explanation
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          if [ ! -s changed_files.txt ]; then
            echo "No files to explain"
            exit 0
          fi

          echo ""
          echo "🤖 Generating AI explanation for PR changes..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          PR_TITLE="${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event.repository.name }}"
          PR_DESCRIPTION="${{ github.event_name == 'pull_request' && github.event.pull_request.body || 'Manual workflow execution' }}"

          PYTHONPATH=src python -m analyzer.main --config config/rules.yaml explain . \
            --pr-title "$PR_TITLE" \
            --pr-description "$PR_DESCRIPTION" \
            --output explanation-results.json || {
              echo "⚠️  AI explanation timed out or failed"
              echo "This does not affect the PR review status"
            }

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Run PR Code Review (Blocking)
        id: code-review
        timeout-minutes: 4
        run: |
          if [ ! -s changed_files.txt ]; then
            echo "✅ No supported files changed"
            exit 0
          fi

          echo "🔍 Running code review on PR changes only..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          BLOCKING_FOUND=0

          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "Analyzing: $file"
              PYTHONPATH=src python -m analyzer.main --config config/rules.yaml file "$file" --show-code || BLOCKING_FOUND=1
            fi
          done < changed_files.txt

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "$BLOCKING_FOUND" -ne 0 ]; then
            echo "❌ Code review failed - blocking violations found"
            exit 1
          fi

          echo "✅ Code review passed - no blocking violations found"

      - name: Detect Potential Defects (Non-blocking)
        id: defect-detection
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: |
          if [ ! -s changed_files.txt ]; then
            echo "No files to inspect for potential defects"
            exit 0
          fi

          echo ""
          echo "🧠 Detecting potential defects in PR changes..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          PR_TITLE="${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event.repository.name }}"
          PR_DESCRIPTION="${{ github.event_name == 'pull_request' && github.event.pull_request.body || 'Manual workflow execution' }}"

          PYTHONPATH=src python -m analyzer.main --config config/rules.yaml defects . \
            --pr-title "$PR_TITLE" \
            --pr-description "$PR_DESCRIPTION" \
            --output defect-results.json || {
              echo "⚠️  Potential defect detection failed"
              echo "This does not affect the PR review status"
            }

          echo "This step is informational and does not affect PR review status"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Upload Analysis Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-review-report
          path: |
            analysis-results.json
            explanation-results.json
            defect-results.json
            /tmp/ollama.log

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🤖 AI Code Review Complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Three-Step Analysis:"
          echo "  1. 🤖 AI Code Explanation (Non-blocking)"
          echo "     • Explains what changed and why"
          echo "     • Uses Ollama when available, with heuristic fallback"
          echo "     • Does not block merge if it fails"
          echo ""
          echo "  2. 🔍 PR Code Review (Blocking)"
          echo "     • Analyzes only changed files in PR"
          echo "     • Detects violations (CRITICAL/HIGH/MEDIUM/LOW)"
          echo "     • Fails the workflow when blocking violations are found"
          echo ""
          echo "  3. 🧠 Potential Defect Detection (Non-blocking)"
          echo "     • Uses Ollama to identify likely defects in changed code"
          echo "     • Focuses on PR-only changed files"
          echo "     • Does not block merge if it fails or finds issues"
          echo ""
          echo "AI Model: qwen2.5-coder:1.5b"
          echo "Endpoint: http://127.0.0.1:11434"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

