name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  code-review:
    name: Automated Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama server failed to start"
          cat /tmp/ollama.log || true
          exit 1

      - name: Pull Ollama model
        run: |
          ollama pull qwen2.5-coder:1.5b

      - name: Generate changed file list
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" \
              | grep -E '\.(java|ts|tsx|scss)$' > changed_files.txt || true
          else
            find . -type f \( -name "*.java" -o -name "*.ts" -o -name "*.tsx" -o -name "*.scss" \) \
              | sed 's#^\./##' > changed_files.txt
          fi

          echo "Changed/supported files:"
          cat changed_files.txt || true

      - name: Run combined review
        id: analysis
        run: |
          if [ ! -s changed_files.txt ]; then
            echo "No supported files changed"
            exit 0
          fi

          PYTHONPATH=src python -m analyzer.main --config config/rules.yaml review . \
            --pr-title "${{ github.event.pull_request.title || github.event.repository.name }}" \
            --pr-description "${{ github.event.pull_request.body || 'Manual workflow execution' }}" \
            --output analysis-results.json

      - name: Upload Analysis Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-review-report
          path: |
            analysis-results.json
            /tmp/ollama.log

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🤖 AI Code Review Complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Includes:"
          echo "  • Static violation analysis"
          echo "  • Ollama-backed PR explanation"
          echo "  • Heuristic fallback if model output is unusable"
          echo ""
          echo "Ollama endpoint used inside runner:"
          echo "  http://127.0.0.1:11434"
          echo ""
          echo "Model:"
          echo "  qwen2.5-coder:1.5b"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

