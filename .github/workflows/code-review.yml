name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  code-review:
    name: Automated Code Review
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Get changed Java files
        id: changed-files
        run: |
          # Get list of changed Java files
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep '\.java$' > changed_files.txt || echo "No Java files changed"
          cat changed_files.txt
      
      - name: Run Code Analysis
        id: analysis
        run: |
          # Run analyzer on each changed Java file
          echo "Analyzing changed Java files..."
          
          # Check if there are any Java files to analyze
          if [ ! -s changed_files.txt ]; then
            echo "No Java files to analyze"
            exit 0
          fi
          
          # Track if we found blocking violations
          FOUND_BLOCKING=0
          
          # Analyze each file
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "📄 Analyzing: $file"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              
              # Run analyzer and capture output
              if python3 -m src.analyzer.main file "$file" 2>&1 | tee analysis_output.txt; then
                # Check if output contains CRITICAL or HIGH violations
                if grep -E "(🔴|🟡).*CRITICAL|HIGH" analysis_output.txt > /dev/null; then
                  FOUND_BLOCKING=1
                  echo ""
                  echo "⚠️  BLOCKING VIOLATIONS FOUND IN THIS FILE"
                fi
              fi
            fi
          done < changed_files.txt
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Analysis Complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if [ $FOUND_BLOCKING -eq 1 ]; then
            echo ""
            echo "❌ CRITICAL OR HIGH PRIORITY VIOLATIONS DETECTED"
            echo "   These must be fixed before the PR can be merged."
            echo ""
            exit 1
          else
            echo ""
            echo "✅ No blocking violations found"
            echo "   Code meets quality standards!"
            echo ""
            exit 0
          fi
      
      - name: Upload Analysis Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-review-report
          path: analysis-results.json
      
      - name: Summary
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🤖 AI Code Review Complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Review the detailed analysis above for all violations found."
          echo ""
          echo "Severity Levels:"
          echo "  🔴 CRITICAL - Security vulnerabilities, must fix immediately"
          echo "  🟡 HIGH     - Code quality issues, should fix before merge"
          echo "  🔵 MEDIUM   - Best practices, recommended to fix"
          echo "  ⚪ LOW      - Style/formatting, nice to fix"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

