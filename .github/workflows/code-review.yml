name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  code-review:
    name: Automated Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama server is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama server failed to start"
          cat /tmp/ollama.log || true
          exit 1

      - name: Pull Ollama model
        run: |
          ollama pull qwen2.5-coder:1.5b

      - name: Generate changed file list
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" \
              | grep -E '\.(java|ts|tsx|scss)$' > changed_files.txt || true
          else
            find . -type f \( -name "*.java" -o -name "*.ts" -o -name "*.tsx" -o -name "*.scss" \) \
              | sed 's#^\./##' > changed_files.txt
          fi

          echo "Changed/supported files:"
          cat changed_files.txt || true

      - name: Run PR Code Review (Blocking)
        id: code-review
        timeout-minutes: 3
        run: |
          if [ ! -s changed_files.txt ]; then
            echo "✅ No supported files changed"
            exit 0
          fi

          echo "🔍 Running code review on PR changes only..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Analyze only changed files (not entire repo)
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "Analyzing: $file"
              PYTHONPATH=src python -m analyzer.main --config config/rules.yaml file "$file" \
                --output-format github || exit 1
            fi
          done < changed_files.txt
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Code review passed - no blocking violations found"

      - name: Generate AI Code Explanation (Non-blocking)
        id: ai-explanation
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        run: |
          if [ ! -s changed_files.txt ]; then
            echo "No files to explain"
            exit 0
          fi

          echo ""
          echo "🤖 Generating AI explanation for PR changes..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Get only the changed files for explanation
          CHANGED_FILES=$(cat changed_files.txt | tr '\n' ' ')
          
          timeout 2m PYTHONPATH=src python -m analyzer.main --config config/rules.yaml explain $CHANGED_FILES || {
            echo "⚠️  AI explanation timed out or failed"
            echo "This does not affect the PR review status"
          }
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Upload Analysis Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-review-report
          path: |
            analysis-results.json
            /tmp/ollama.log

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🤖 AI Code Review Complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Two-Step Analysis:"
          echo "  1. 🔍 PR Code Review (Blocking)"
          echo "     • Analyzes only changed files in PR"
          echo "     • Detects violations (CRITICAL/HIGH/MEDIUM/LOW)"
          echo "     • Blocks merge if CRITICAL/HIGH violations found"
          echo ""
          echo "  2. 🤖 AI Code Explanation (Non-blocking)"
          echo "     • Explains what changed and why"
          echo "     • Provides context for reviewers"
          echo "     • Does not block merge if it fails"
          echo ""
          echo "AI Model: qwen2.5-coder:1.5b"
          echo "Endpoint: http://127.0.0.1:11434"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

