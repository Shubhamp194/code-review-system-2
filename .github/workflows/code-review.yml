name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  code-review:
    name: Automated Code Review
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Get changed Java files
        id: changed-files
        run: |
          # Get list of changed Java files
          git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep '\.java$' > changed_files.txt || echo "No Java files changed"
          cat changed_files.txt
      
      - name: Run Code Analysis
        id: analysis
        run: |
          # Run analyzer on each changed Java file
          echo "Analyzing changed Java files..."
          
          # Initialize results
          echo '{"violations": [], "total_violations": 0, "blocking_violations": 0, "should_block": false, "summary": {"critical": 0, "high": 0, "medium": 0, "low": 0}}' > analysis-results.json
          
          # Check if there are any Java files to analyze
          if [ ! -s changed_files.txt ]; then
            echo "No Java files to analyze"
            exit 0
          fi
          
          # Analyze each file
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "Analyzing: $file"
              python3 -m src.analyzer.main file "$file" || true
            fi
          done < changed_files.txt
        continue-on-error: true
      
      - name: Upload Analysis Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-review-report
          path: analysis-results.json
      
      - name: Check Analysis Results
        run: |
          echo "Code analysis completed successfully!"
          echo "Check the logs above for detailed violation reports."

